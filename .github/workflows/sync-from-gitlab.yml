name: Sync GitLab to GitHub

on:
  schedule:
    - cron: "*/15 * * * *"  # Every 15 minutes
  workflow_dispatch:        # Manual trigger

permissions:
  contents: write
  workflows: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch GitLab repository
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git remote add gitlab https://oauth2:${GITLAB_TOKEN}@dtl-server-2.st.lab.au.dk/gitlab/dtaas/biljan.git
          git fetch gitlab main:refs/remotes/gitlab/main --tags
      - name: Push changes to GitHub
        run: |
          git push origin refs/remotes/gitlab/main:refs/heads/main --force
          git push origin --tags --force