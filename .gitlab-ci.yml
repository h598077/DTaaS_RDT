image: fedora:41

stages:
  - triggers

trigger_hello-world:
  stage: triggers
  trigger:
    include: digital_twins/hello-world/.gitlab-ci.yml
  rules:
    - if: '$DTName == "hello-world"'
      when: always
  variables:
    RunnerTag: $RunnerTag

