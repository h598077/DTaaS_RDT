stages:
    - create

    


incubator-rdt:
  stage: create
  tags:
    - docker
  script:
    - cd digital_twins/incubator-rdt
    - chmod +x lifecycle/create 
    - lifecycle/create 
    - chmod +x lifecycle/executefmu
    - lifecycle/executefmu
    - chmod +x lifecycle/execute 
    - lifecycle/execute
    - EXECUTE_PID=$!
    - sleep 10 
    - chmod +x lifecycle/execute2
    - lifecycle/execute2 





