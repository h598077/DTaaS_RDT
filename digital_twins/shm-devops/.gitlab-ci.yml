image: ubuntu:24.04

stages:
    - create
    - execute

create_shm-devops:
    stage: create
    script:
        - cd digital_twins/shm-devops
        - chmod +x lifecycle/create
        - bash lifecycle/create
    tags:
        - $RunnerTag

execute_shm-devops:
    stage: execute
    script:
        - cd digital_twins/shm-devops
        - chmod +x lifecycle/execute
        - bash lifecycle/execute
    tags:
        - $RunnerTag
